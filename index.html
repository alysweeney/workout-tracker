<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Workouts" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>Workout Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="topbar-title">Workout Tracker</h1>
    <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Backup / Restore">⚙️</button>
  </header>

  <main id="app"></main>

  <nav class="bottomnav">
    <button class="nav-btn" data-route="log">
      <span class="nav-icon">🏋️</span><span>Log</span>
    </button>
    <button class="nav-btn" data-route="history">
      <span class="nav-icon">📅</span><span>History</span>
    </button>
    <button class="nav-btn" data-route="trends">
      <span class="nav-icon">📈</span><span>Trends</span>
    </button>
  </nav>

  <div id="modal-root"></div>

  <script src="data.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
